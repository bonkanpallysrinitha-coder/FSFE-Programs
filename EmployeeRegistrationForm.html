<html>
    <head>
        <title>Employee Registration Form</title>
    </head>
    <body>
        <h2>Employee Registration Form</h2>
        <form action="#" method="post">
            <label for="name">Employee Name:</label>
            <input type="text" id="name" name="name" required><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>
            <lable for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required><br><br>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required><br><br>
            <label for="interviewTime">Preferred Interview Time:</label>
            <input type="time" id="interviewTime" name="interviewTime" required><br><br>
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select><br><br>
            <label for="skills">Skills:</label>
            <select id="skills" name="skills" multiple required>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="java">Java</option>
            </select><br><br>
            <label for="dateOfBirth">Date of Birth:</label>
            <select id="dateOfBirth" name="dateOfBirth" required>
                <option value="">Select</option>
                <option value="2000-01-01">January 1, 2000</option>
                <option value="2001-02-02">February 2, 2001</option>
                <option value="2002-03-03">March 3, 2002</option>
            </select><br><br>
            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="">Select</option>
                <option value="computer-science">Computer Science</option>
                <option value="mathematics">Mathematics</option>
                <option value="physics">Physics</option>
            </select><br><br>
            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required><br><br>
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" cols="50" required></textarea><br><br>
            <label for="experience">Years of Experience:</label>
            <input type="number" id="experience" name="experience" required><br><br>
            <label for="linkedin">LinkedIn Profile:</label>
            <input type="url" id="linkedin" name="linkedin" required><br><br>
            <input type="submit" value="Register">
            <input type="reset" value="Reset">
        </form>
    </body>
</html>
